services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jobsrch
      MYSQL_USER: jobsrch
      MYSQL_PASSWORD: jobsrch
      MYSQL_ROOT_PASSWORD: jobsrch-root
    ports:
      - "3306:3306"
    volumes:
      - jobsrch-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pjobsrch-root"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  jobsrch-mysql:
