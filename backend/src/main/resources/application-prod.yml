spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      internal-proxies: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}|::1'

jobsrch:
  jwt:
    secret: ${JWT_SECRET}
  auth-cookie:
    secure: true
    same-site: Strict
  password-reset:
    expose-development-token: false
  account-security:
    expose-development-email-change-token: false
  email:
    resend-api-key: ${RESEND_API_KEY}
    from: ${PASSWORD_RESET_FROM}
    frontend-base-url: ${FRONTEND_BASE_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  malware-scan:
    enabled: true
    host: ${CLAMAV_HOST:clamav}
    port: ${CLAMAV_PORT:3310}
