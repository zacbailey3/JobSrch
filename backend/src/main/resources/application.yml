spring:
  application:
    name: JobSrch
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jobsrch?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:jobsrch}
    password: ${DB_PASSWORD:jobsrch}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: BINARY
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

jobsrch:
  jwt:
    issuer: jobsrch-api
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
    ttl: PT8H
  storage:
    resume-directory: ${RESUME_DIRECTORY:./data/resumes}

management:
  endpoints:
    web:
      exposure:
        include: health,info
