spring:
  datasource:
    url: jdbc:h2:mem:jobsrch;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

jobsrch:
  jwt:
    issuer: jobsrch-test
    secret: test-secret-that-is-at-least-thirty-two-bytes-long
    ttl: PT1H
  auth-cookie:
    name: JOBSRCH_SESSION
    secure: false
    same-site: Strict
  password-reset:
    ttl: PT15M
    expose-development-token: true
  account-security:
    recent-authentication-window: PT10M
    email-change-ttl: PT15M
    expose-development-email-change-token: true
  email:
    resend-api-key:
    from:
    frontend-base-url: http://localhost:4200
  cors:
    allowed-origins:
      - http://localhost:4200
  storage:
    resume-directory: ${java.io.tmpdir}/jobsrch-test-resumes
  malware-scan:
    enabled: false
    host: localhost
    port: 3310
    connect-timeout: PT1S
    read-timeout: PT1S
  resume-analysis:
    timeout: PT15S
    worker-count: 2
    queue-capacity: 20
    max-pdf-pages: 100
    max-text-length: 200000
  import:
    enabled: false
