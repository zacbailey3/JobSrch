spring:
  application:
    name: JobSrch
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jobsrch?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:jobsrch}
    password: ${DB_PASSWORD:jobsrch}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: BINARY
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

jobsrch:
  jwt:
    issuer: jobsrch-api
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
    ttl: PT8H
  auth-cookie:
    name: JOBSRCH_SESSION
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
  password-reset:
    ttl: PT15M
    expose-development-token: ${PASSWORD_RESET_EXPOSE_TOKEN:true}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${PASSWORD_RESET_FROM:}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8080,http://127.0.0.1:8080}
  storage:
    resume-directory: ${RESUME_DIRECTORY:./data/resumes}
  malware-scan:
    enabled: ${MALWARE_SCAN_ENABLED:false}
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    connect-timeout: PT2S
    read-timeout: PT30S
  resume-analysis:
    timeout: PT15S
    worker-count: 2
    queue-capacity: 20
    max-pdf-pages: 100
    max-text-length: 200000
  providers:
    usajobs:
      email: ${USAJOBS_EMAIL:}
      api-key: ${USAJOBS_API_KEY:}
    adzuna:
      app-id: ${ADZUNA_APP_ID:}
      app-key: ${ADZUNA_APP_KEY:}
  import:
    enabled: ${JOB_IMPORT_ENABLED:true}
    initial-delay-ms: ${JOB_IMPORT_INITIAL_DELAY_MS:15000}
    fixed-delay-ms: ${JOB_IMPORT_FIXED_DELAY_MS:21600000}
    expire-after-hours: ${JOB_EXPIRE_AFTER_HOURS:72}
    audit-retention-days: ${JOB_IMPORT_AUDIT_RETENTION_DAYS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
